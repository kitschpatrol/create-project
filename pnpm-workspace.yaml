allowBuilds:
  # Sass uses its JS API; its optional native watcher is not needed.
  '@parcel/watcher': false
  core-js: false
  electron-winstaller: true
  esbuild: true
  workerd: true
ignoreWorkspaceRootCheck: true
overrides:
  # Remove once typescript-eslint fixes single-run Program memory use, which
  # exhausts the default heap when linting all templates at once.
  # https://github.com/typescript-eslint/typescript-eslint/issues/13109
  '@typescript-eslint/typescript-estree': 8.72.0
  # Remove when Miniflare updates its Undici pin to include these security fixes.
  # https://github.com/nodejs/undici/releases/tag/v7.30.2
  miniflare>undici@7.30.1: 7.30.2
packages:
  - '.'
  - templates/*
  - templates/unplugin/playground
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  mdat:
    skills: false
  taze:
    skills: true
  tsdown:
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
