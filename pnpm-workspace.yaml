packages:
  - '.'
  - templates/*
  - templates/unplugin/playground
ignoreWorkspaceRootCheck: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  oxc-resolver: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/*'
  - mdat-plugin-cli-help@3.2.0
  - '@e18e/eslint-plugin@0.8.1'
  - eslint-plugin-astro@3.2.1
  - lognow@0.8.2
  - mdat@3.2.1
  - metascope@0.12.0
  - remark-mdat@3.0.2
