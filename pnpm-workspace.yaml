allowBuilds:
  core-js: false
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
  workerd: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/cspell-config@8.13.1'
  - '@kitschpatrol/eslint-config@8.13.1'
  - '@kitschpatrol/knip-config@8.13.1'
  - '@kitschpatrol/mdat-config@8.13.1'
  - '@kitschpatrol/prettier-config@8.13.1'
  - '@kitschpatrol/remark-config@8.13.1'
  - '@kitschpatrol/repo-config@8.13.1'
  - '@kitschpatrol/shared-config@8.13.1'
  - '@kitschpatrol/stylelint-config@8.13.1'
  - '@kitschpatrol/typescript-config@8.13.1'
  - '@rolldown/binding-android-arm-eabi@1.2.13'
  - '@rolldown/binding-android-arm64@1.2.13'
  - '@rolldown/binding-darwin-arm64@1.2.13'
  - '@rolldown/binding-darwin-x64@1.2.13'
  - '@rolldown/binding-freebsd-x64@1.2.13'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.13'
  - '@rolldown/binding-linux-arm64-gnu@1.2.13'
  - '@rolldown/binding-linux-arm64-musl@1.2.13'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.13'
  - '@rolldown/binding-linux-s390x-gnu@1.2.13'
  - '@rolldown/binding-linux-x64-gnu@1.2.13'
  - '@rolldown/binding-linux-x64-musl@1.2.13'
  - '@rolldown/binding-openharmony-arm64@1.2.13'
  - '@rolldown/binding-win32-arm64-msvc@1.2.13'
  - '@rolldown/binding-win32-x64-msvc@1.2.13'
  - '@rollup/rollup-android-arm-eabi@4.64.2'
  - '@rollup/rollup-android-arm64@4.64.2'
  - '@rollup/rollup-darwin-arm64@4.64.2'
  - '@rollup/rollup-darwin-x64@4.64.2'
  - '@rollup/rollup-freebsd-arm64@4.64.2'
  - '@rollup/rollup-freebsd-x64@4.64.2'
  - '@rollup/rollup-linux-arm-gnueabihf@4.64.2'
  - '@rollup/rollup-linux-arm-musleabihf@4.64.2'
  - '@rollup/rollup-linux-arm64-gnu@4.64.2'
  - '@rollup/rollup-linux-arm64-musl@4.64.2'
  - '@rollup/rollup-linux-loong64-gnu@4.64.2'
  - '@rollup/rollup-linux-loong64-musl@4.64.2'
  - '@rollup/rollup-linux-ppc64-gnu@4.64.2'
  - '@rollup/rollup-linux-ppc64-musl@4.64.2'
  - '@rollup/rollup-linux-riscv64-gnu@4.64.2'
  - '@rollup/rollup-linux-riscv64-musl@4.64.2'
  - '@rollup/rollup-linux-s390x-gnu@4.64.2'
  - '@rollup/rollup-linux-x64-gnu@4.64.2'
  - '@rollup/rollup-linux-x64-musl@4.64.2'
  - '@rollup/rollup-openbsd-x64@4.64.2'
  - '@rollup/rollup-openharmony-arm64@4.64.2'
  - '@rollup/rollup-win32-arm64-msvc@4.64.2'
  - '@rollup/rollup-win32-ia32-msvc@4.64.2'
  - '@rollup/rollup-win32-x64-gnu@4.64.2'
  - '@rollup/rollup-win32-x64-msvc@4.64.2'
  - bingo@0.13.2
  - electron@44.7.0
  - mdat-plugin-cli-help@3.4.1
  - rolldown@1.2.13
  - rollup@4.64.2
overrides:
  # Remove when Miniflare includes the fix for GHSA-wq5f-xc86-pv6w.
  miniflare@5.20261006.0-alpha>sharp: 0.35.5
packages:
  - '.'
  - templates/*
  - templates/unplugin/playground
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
