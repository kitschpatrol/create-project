allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/cspell-config@8.15.0'
  - '@kitschpatrol/eslint-config@8.15.0'
  - '@kitschpatrol/knip-config@8.15.0'
  - '@kitschpatrol/mdat-config@8.15.0'
  - '@kitschpatrol/prettier-config@8.15.0'
  - '@kitschpatrol/remark-config@8.15.0'
  - '@kitschpatrol/repo-config@8.15.0'
  - '@kitschpatrol/shared-config@8.15.0'
  - '@kitschpatrol/stylelint-config@8.15.0'
  - '@kitschpatrol/typescript-config@8.15.0'
  - mdat@3.7.0
  - remark-mdat@3.1.4
overrides:
  # Remove when Miniflare updates its Undici pin to include these security fixes.
  # https://github.com/nodejs/undici/releases/tag/v7.30.2
  miniflare>undici@7.30.1: 7.30.2
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  modern-web-guidance:
    skills: [modern-web-guidance]
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
